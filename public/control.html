<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Space Overlay Control</title>
    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Loading Orbitron and Oxanium to match overlay aesthetics in the control dashboard -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Oxanium:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="control-page">
    <div class="scanlines" aria-hidden="true"></div>
    <main class="control-shell">
      <section class="control-header">
        <div>
          <p class="eyebrow">Space Stream Overlay // COCKPIT UNIT</p>
          <h1>MISSION CONTROL</h1>
          <div class="dashboard-diagnostic">
            <span>CORE_LINK: STABLE</span>
            <span>PORT_8787 // SECURE</span>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 12px;">
          <button class="ghost-button" id="resetLayoutButton" data-action="layout:reset" type="button" style="border-color: rgba(0, 255, 170, 0.4) !important; color: var(--nms-emerald) !important; font-size: 0.72rem; padding: 0 16px; min-height: 36px;">Reset Layout</button>
          <div class="connection-badge" id="connectionBadge">Connecting</div>
        </div>
      </section>

      <section class="preview-band">
        <div class="preview-frame">
          <div class="preview-topbar">
            <span>Overlay Preview</span>
            <span>16:9</span>
          </div>
          <iframe title="Overlay preview" src="/overlay?demo=1"></iframe>
        </div>
        <div class="url-panel">
          <label for="overlayUrl">Browser source URL</label>
          <input id="overlayUrl" readonly>
          <div class="button-row">
            <button class="primary-button" id="copyOverlayButton" type="button">Copy URL</button>
            <button class="secondary-button" id="openOverlayButton" type="button">Open</button>
          </div>
        </div>
      </section>

      <section class="control-grid">
        <form class="control-panel" id="detailsForm">
          <div class="hud-corner top-left"></div>
          <div class="hud-corner top-right"></div>
          <div class="hud-corner bottom-left"></div>
          <div class="hud-corner bottom-right"></div>
          <div class="panel-heading">
            <h2>Stream Details</h2>
            <button class="primary-button" type="submit">Save</button>
          </div>
          <label>
            Streamer name
            <input name="streamerName" id="streamerNameInput" maxlength="28">
          </label>
          <label>
            Game title
            <input name="gameTitle" id="gameTitleInput" maxlength="32">
          </label>
          <label>
            Status
            <input name="statusText" id="statusTextInput" maxlength="16">
          </label>
        </form>

        <section class="control-panel">
          <div class="hud-corner top-left"></div>
          <div class="hud-corner top-right"></div>
          <div class="hud-corner bottom-left"></div>
          <div class="hud-corner bottom-right"></div>
          <div class="panel-heading">
            <h2>Stats</h2>
            <button class="ghost-button" data-action="stats:reset" type="button">Reset</button>
          </div>
          <div class="counter-row">
            <div>
              <span>Kills</span>
              <strong id="killsReadout">0</strong>
            </div>
            <div class="stepper">
              <button data-action="kills:subtract" type="button" aria-label="Subtract kill">-</button>
              <button data-action="kills:add" type="button" aria-label="Add kill">+</button>
            </div>
          </div>
          <div class="counter-row">
            <div>
              <span>Wins</span>
              <strong id="winsReadout">0</strong>
            </div>
            <div class="stepper">
              <button data-action="wins:subtract" type="button" aria-label="Subtract win">-</button>
              <button data-action="wins:add" type="button" aria-label="Add win">+</button>
            </div>
          </div>
        </section>

        <section class="control-panel">
          <div class="hud-corner top-left"></div>
          <div class="hud-corner top-right"></div>
          <div class="hud-corner bottom-left"></div>
          <div class="hud-corner bottom-right"></div>
          <div class="panel-heading">
            <h2>Timer</h2>
            <button class="ghost-button" data-action="timer:reset" type="button">Reset</button>
          </div>
          <div class="timer-readout" id="timerReadout">00:00</div>
          <div class="segmented-control" role="group" aria-label="Timer mode">
            <button id="countUpButton" data-mode="countup" type="button">Count Up</button>
            <button id="countDownButton" data-mode="countdown" type="button">Countdown</button>
          </div>
          <div class="button-row">
            <button class="primary-button" data-action="timer:start" type="button">Start</button>
            <button class="secondary-button" data-action="timer:pause" type="button">Pause</button>
          </div>
          <label>
            Countdown minutes
            <input id="durationInput" type="number" min="1" max="1440" step="1">
          </label>
        </section>

        <form class="control-panel" id="goalForm">
          <div class="hud-corner top-left"></div>
          <div class="hud-corner top-right"></div>
          <div class="hud-corner bottom-left"></div>
          <div class="hud-corner bottom-right"></div>
          <div class="panel-heading">
            <h2>Subscriber Goal</h2>
            <button class="primary-button" type="submit">Save</button>
          </div>
          <div class="counter-row">
            <div>
              <span>Current</span>
              <strong id="subsReadout">42</strong>
            </div>
            <div class="stepper">
              <button data-action="subs:subtract" type="button" aria-label="Subtract subscriber">-</button>
              <button data-action="subs:add" type="button" aria-label="Add subscriber">+</button>
            </div>
          </div>
          <label>
            Goal label
            <input name="subLabel" id="subLabelInput" maxlength="28">
          </label>
          <label>
            Current subscribers
            <input name="subsCurrent" id="subsCurrentInput" type="number" min="0" max="999999">
          </label>
          <label>
            Target subscribers
            <input name="subsTarget" id="subsTargetInput" type="number" min="1" max="999999">
          </label>
        </form>

        <form class="control-panel control-panel-wide" id="layoutForm">
          <div class="hud-corner top-left"></div>
          <div class="hud-corner top-right"></div>
          <div class="hud-corner bottom-left"></div>
          <div class="hud-corner bottom-right"></div>
          <div class="panel-heading">
            <h2>Layout Fine-Tune</h2>
            <button class="primary-button" type="submit">Save Layout</button>
          </div>
          <div class="layout-editor">
            <label>Top HUD X<input id="layoutTopHudX" type="number" min="-50" max="150"></label>
            <label>Top HUD Y<input id="layoutTopHudY" type="number" min="-50" max="150"></label>
            <label>Kills X<input id="layoutKillX" type="number" min="-50" max="150"></label>
            <label>Kills Y<input id="layoutKillY" type="number" min="-50" max="150"></label>
            <label>Wins X<input id="layoutWinX" type="number" min="-50" max="150"></label>
            <label>Wins Y<input id="layoutWinY" type="number" min="-50" max="150"></label>
            <label>Timer X<input id="layoutTimerX" type="number" min="-50" max="150"></label>
            <label>Timer Y<input id="layoutTimerY" type="number" min="-50" max="150"></label>
            <label>Goal X<input id="layoutGoalX" type="number" min="-50" max="150"></label>
            <label>Goal Y<input id="layoutGoalY" type="number" min="-50" max="150"></label>
          </div>
        </form>

        <form class="control-panel control-panel-wide" id="settingsForm">
          <div class="hud-corner top-left"></div>
          <div class="hud-corner top-right"></div>
          <div class="hud-corner bottom-left"></div>
          <div class="hud-corner bottom-right"></div>
          <div class="panel-heading">
            <h2>Effects & Audio</h2>
            <button class="primary-button" type="submit">Save Settings</button>
          </div>
          <div class="settings-editor">
            <label>Panel scale %<input id="panelScaleInput" type="number" min="60" max="140"></label>
            <label>Panel opacity %<input id="panelOpacityInput" type="number" min="20" max="100"></label>
            <label>Effects intensity %<input id="effectsIntensityInput" type="number" min="0" max="140"></label>
            <label>Audio volume %<input id="audioVolumeInput" type="number" min="0" max="100"></label>
          </div>
          <label class="toggle-row">
            <input id="audioEnabledInput" type="checkbox">
            Enable kill/win/sub sounds
          </label>
          <label>
            Kill sound URL
            <input id="killSoundUrlInput" placeholder="/kill.mp3 or https://...">
          </label>
          <label>
            Win sound URL
            <input id="winSoundUrlInput" placeholder="/victory.mp3 or https://...">
          </label>
          <label>
            Subscriber sound URL
            <input id="subSoundUrlInput" placeholder="/sub.mp3 or https://...">
          </label>
        </form>
      </section>
    </main>

    <script src="/control.js"></script>
  </body>
</html>
